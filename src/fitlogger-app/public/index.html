<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitlogger — Homelab Fitness Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .logo-group h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-group h1 span {
      color: var(--primary);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: var(--primary);
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select, textarea {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .workout-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .workout-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .workout-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .workout-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .workout-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .workout-notes {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-style: italic;
      margin-top: 0.2rem;
    }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <h1><span>⚡</span> Fitlogger</h1>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span> K3s Homelab Active
      </div>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Logged</span>
        <span class="stat-value" id="stat-count">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Sets</span>
        <span class="stat-value" id="stat-sets">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Reps</span>
        <span class="stat-value" id="stat-reps">0</span>
      </div>
    </section>

    <section class="card">
      <h2>Log New Workout</h2>
      <form id="workout-form">
        <div class="form-group">
          <label for="exercise">Exercise Name</label>
          <input type="text" id="exercise" placeholder="e.g. Deadlift" required>
        </div>
        <div class="form-group">
          <label for="sets">Sets</label>
          <input type="number" id="sets" min="1" max="100" placeholder="4" required>
        </div>
        <div class="form-group">
          <label for="reps">Reps per set</label>
          <input type="number" id="reps" min="1" max="500" placeholder="10" required>
        </div>
        <div class="form-group">
          <label for="weight">Weight</label>
          <input type="number" id="weight" step="0.5" placeholder="80">
        </div>
        <div class="form-group">
          <label for="unit">Unit</label>
          <select id="unit">
            <option value="kg">kg</option>
            <option value="lbs">lbs</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label for="notes">Notes / Observations</label>
          <input type="text" id="notes" placeholder="RPE 8, good tempo...">
        </div>
        <div class="form-group full-width">
          <button type="submit">+ Record Activity</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Workout History</h2>
      <div class="workout-list" id="workout-list">
        <div class="empty-state">Loading workout history...</div>
      </div>
    </section>
  </div>

  <script>
    const workoutListEl = document.getElementById('workout-list');
    const workoutForm = document.getElementById('workout-form');
    const statCountEl = document.getElementById('stat-count');
    const statSetsEl = document.getElementById('stat-sets');
    const statRepsEl = document.getElementById('stat-reps');

    async function loadWorkouts() {
      try {
        const res = await fetch('/api/workouts');
        const data = await res.json();
        renderWorkouts(data);
      } catch (err) {
        workoutListEl.innerHTML = `<div class="empty-state" style="color:var(--danger)">Error loading workouts: ${err.message}</div>`;
      }
    }

    function renderWorkouts(workouts) {
      if (!workouts || workouts.length === 0) {
        workoutListEl.innerHTML = '<div class="empty-state">No workouts recorded yet. Start training!</div>';
        statCountEl.textContent = '0';
        statSetsEl.textContent = '0';
        statRepsEl.textContent = '0';
        return;
      }

      let totalSets = 0;
      let totalReps = 0;

      workoutListEl.innerHTML = workouts.map(w => {
        totalSets += (w.sets || 0);
        totalReps += (w.sets || 0) * (w.reps || 0);

        return `
          <div class="workout-item">
            <div class="workout-info">
              <div class="workout-title">${escapeHtml(w.exercise)}</div>
              <div class="workout-meta">
                <span>📅 ${w.date}</span>
                <span>💪 ${w.sets} sets × ${w.reps} reps</span>
                <span>⚖️ ${w.weight} ${w.unit}</span>
              </div>
              ${w.notes ? `<div class="workout-notes">${escapeHtml(w.notes)}</div>` : ''}
            </div>
            <button class="btn-delete" onclick="deleteWorkout(${w.id})">Delete</button>
          </div>
        `;
      }).join('');

      statCountEl.textContent = workouts.length;
      statSetsEl.textContent = totalSets;
      statRepsEl.textContent = totalReps;
    }

    workoutForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        exercise: document.getElementById('exercise').value,
        sets: Number(document.getElementById('sets').value),
        reps: Number(document.getElementById('reps').value),
        weight: Number(document.getElementById('weight').value) || 0,
        unit: document.getElementById('unit').value,
        notes: document.getElementById('notes').value
      };

      try {
        const res = await fetch('/api/workouts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Failed to save workout');
        workoutForm.reset();
        await loadWorkouts();
      } catch (err) {
        alert(err.message);
      }
    });

    async function deleteWorkout(id) {
      if (!confirm('Are you sure you want to remove this log?')) return;
      try {
        const res = await fetch(`/api/workouts/${id}`, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error('Failed to delete workout');
        await loadWorkouts();
      } catch (err) {
        alert(err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m]));
    }

    loadWorkouts();
  </script>
</body>
</html>
