apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
  namespace: container-registry
  labels:
    app.kubernetes.io/name: registry-ui
    app.kubernetes.io/part-of: fitlogger-infra
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-ui
    spec:
      containers:
        - name: registry-ui
          image: joxit/docker-registry-ui:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_TITLE
              value: "Fitlogger Container Registry"
            - name: SINGLE_REGISTRY
              value: "true"
            - name: DELETE_IMAGES
              value: "true"
            - name: SHOW_CONTENT_DIGEST
              value: "true"
            - name: CATALOG_ELEMENTS_LIMIT
              value: "100"
            - name: NGINX_PROXY_PASS_URL
              value: "http://registry:5000"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
