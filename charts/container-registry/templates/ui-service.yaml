{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: registry-ui
  labels:
    app.kubernetes.io/name: registry-ui
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry-ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
